<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Arga</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'CF Circuit Electrique', 'Circuit Electrique', 'Circuit', sans-serif;
        }

        body {
            background-color: #070d19;
            color: #e0e6ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Container Jalur PCB SVG (Sisi Kiri & Kanan) */
        .pcb-background {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 320px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.75;
        }

        .pcb-left {
            left: 0;
            mask-image: linear-gradient(to right, rgba(0,0,0,1) 70%, rgba(0,0,0,0));
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 70%, rgba(0,0,0,0));
        }

        .pcb-right {
            right: 0;
            transform: scaleX(-1);
            mask-image: linear-gradient(to right, rgba(0,0,0,1) 70%, rgba(0,0,0,0));
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 70%, rgba(0,0,0,0));
        }

        /* Kartu Profil Utama */
        .container {
            max-width: 480px;
            width: 100%;
            background-color: #111a2e;
            padding: 40px 30px;
            border-radius: 12px;
            border: 1px solid #1f3352;
            text-align: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(72, 202, 228, 0.15);
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #48cae4;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(72, 202, 228, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .title {
            font-size: 1.1rem;
            color: #48cae4;
            margin-bottom: 20px;
            font-style: italic;
        }

        .about {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #d1d5db;
            border-top: 1px solid #1f3352;
            padding-top: 20px;
            margin-bottom: 25px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 25px;
        }

        .social-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background-color: #070d19;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50%;
            border: 1px solid #1f3352;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        .social-card:hover {
            background-color: #1f2a44;
            border-color: #48cae4;
            color: #48cae4;
            box-shadow: 0 0 10px rgba(72, 202, 228, 0.4);
        }

        .social-card svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .category-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-top: 1px solid #1f3352;
            padding-top: 25px;
        }

        .category-btn {
            width: 100%;
            padding: 12px 20px;
            background-color: #070d19;
            color: #ffffff;
            border: 1px solid #1f3352;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, background-color 0.2s;
            text-decoration: none;
        }

        .category-btn:hover {
            border-color: #48cae4;
            background-color: #1f2a44;
            color: #48cae4;
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolkit-icon-img,
        .cv-icon-img {
            width: 26px;
            height: 26px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #48cae4;
            flex-shrink: 0;
        }

        .arrow {
            transition: transform 0.3s ease;
        }

        .arrow.active {
            transform: rotate(180deg);
        }

        .category-content {
            display: none;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
            padding-left: 5px;
        }

        .category-content.open {
            display: flex;
        }

        .sub-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sub-title {
            font-size: 0.95rem;
            color: #48cae4;
            text-align: left;
            font-weight: bold;
            padding-left: 4px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background-color: #131c38;
            color: #e0e6ed;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #2a3a5e;
            font-size: 1rem;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        .link-card:hover {
            background-color: #1f2a44;
            border-color: #48cae4;
            color: #48cae4;
        }

        .brand-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 4px;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .pcb-background {
                width: 120px;
                opacity: 0.4;
            }
        }
    </style>
</head>
